[package]
name = "vault-wasm"
version = "0.1.0"
edition = "2021"
description = "Núcleo do Vault compilado para WebAssembly (usado pela extensão do navegador)"

[lib]
crate-type = ["cdylib"]

[dependencies]
vault-core = { path = "../core" }
# A versão tem que ser igual à do wasm-bindgen-cli instalado (cargo install wasm-bindgen-cli).
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No navegador não há gerador de aleatoriedade nativo: usa crypto.getRandomValues. Só é necessário
# para compilar (a extensão apenas lê o cofre), mas o feature unification liga isso em vault-core.
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["js"] }

[profile.release]
opt-level = 3 # o Argon2 é pesado: velocidade importa mais que o tamanho
lto = true
codegen-units = 1
panic = "abort"
strip = true
