[package]
name = "tauri-plugin-vault-keystore"
version = "0.1.0"
description = "Android Keystore e biometria para o Vault (cifra com chave do hardware)"
edition = "2021"
links = "tauri-plugin-vault-keystore"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
